[project]
name = "parcel-pipeline"
version = "0.1.0"
description = "Parcel Planner data pipeline: source adapters, canonical tables, features and review-activity model"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyarrow>=17",
    "pyproj>=3.6",
    "scikit-learn==1.5.2",
    "scipy>=1.13",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.scripts]
parcel-pipeline = "parcel_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
